<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title description">
  <title id="title">Authenticated feed request sequence</title>
  <desc id="description">The browser sends its token cookie to the Next.js BFF. The BFF forwards the cookie to Express, which verifies the JWT, loads the user, queries unseen profiles from MongoDB, and returns a minimal private response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1160" height="700" fill="#ffffff"/>
  <text x="40" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101828">Authenticated feed sequence</text>

  <g font-family="Arial, sans-serif">
    <rect x="45" y="70" width="190" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#1e3a8a">Web browser</text>
    <rect x="325" y="70" width="190" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="420" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Next.js BFF</text>
    <rect x="605" y="70" width="190" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="700" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Express API</text>
    <rect x="885" y="70" width="190" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="980" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#7c2d12">MongoDB</text>
  </g>

  <g stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="140" y1="130" x2="140" y2="650"/>
    <line x1="420" y1="130" x2="420" y2="650"/>
    <line x1="700" y1="130" x2="700" y2="650"/>
    <line x1="980" y1="130" x2="980" y2="650"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#344054">
    <line x1="140" y1="185" x2="420" y2="185" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="171" text-anchor="middle">GET /api/feed with cookie</text>

    <line x1="420" y1="255" x2="700" y2="255" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="560" y="241" text-anchor="middle">GET /feed with forwarded Cookie</text>

    <rect x="625" y="295" width="150" height="54" rx="8" fill="#ecfdf3" stroke="#86efac"/>
    <text x="700" y="318" text-anchor="middle" font-size="13" fill="#166534">Verify JWT</text>
    <text x="700" y="338" text-anchor="middle" font-size="13" fill="#166534">Load current user</text>

    <line x1="700" y1="400" x2="980" y2="400" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="840" y="386" text-anchor="middle">Query unseen profiles</text>

    <line x1="980" y1="470" x2="700" y2="470" stroke="#667085" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#returnArrow)"/>
    <text x="840" y="456" text-anchor="middle" fill="#667085">Feed records</text>

    <line x1="700" y1="540" x2="420" y2="540" stroke="#667085" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#returnArrow)"/>
    <text x="560" y="526" text-anchor="middle" fill="#667085">Feed response</text>

    <line x1="420" y1="610" x2="140" y2="610" stroke="#667085" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#returnArrow)"/>
    <text x="280" y="596" text-anchor="middle" fill="#667085">Minimal private response</text>
  </g>
</svg>
