<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title description">
  <title id="title">Login request sequence</title>
  <desc id="description">The browser sends login credentials to the Next.js BFF, which forwards them to Express. Express reads MongoDB and returns a user payload and Set-Cookie through the BFF.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1160" height="620" fill="#ffffff"/>
  <text x="40" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101828">Login sequence</text>

  <g font-family="Arial, sans-serif">
    <rect x="45" y="70" width="190" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#1e3a8a">Web browser</text>
    <rect x="325" y="70" width="190" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="420" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Next.js BFF</text>
    <rect x="605" y="70" width="190" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="700" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Express API</text>
    <rect x="885" y="70" width="190" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="980" y="107" text-anchor="middle" font-size="17" font-weight="600" fill="#7c2d12">MongoDB</text>
  </g>

  <g stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="140" y1="130" x2="140" y2="570"/>
    <line x1="420" y1="130" x2="420" y2="570"/>
    <line x1="700" y1="130" x2="700" y2="570"/>
    <line x1="980" y1="130" x2="980" y2="570"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#344054">
    <line x1="140" y1="190" x2="420" y2="190" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="176" text-anchor="middle">POST /api/auth/login</text>

    <line x1="420" y1="270" x2="700" y2="270" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="560" y="256" text-anchor="middle">POST /api/v1/auth/login</text>

    <line x1="700" y1="350" x2="980" y2="350" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="840" y="336" text-anchor="middle">Find user</text>

    <line x1="980" y1="410" x2="700" y2="410" stroke="#667085" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#returnArrow)"/>
    <text x="840" y="396" text-anchor="middle" fill="#667085">User record</text>

    <line x1="700" y1="480" x2="420" y2="480" stroke="#667085" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#returnArrow)"/>
    <text x="560" y="466" text-anchor="middle" fill="#667085">User payload and Set-Cookie</text>

    <line x1="420" y1="550" x2="140" y2="550" stroke="#667085" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#returnArrow)"/>
    <text x="280" y="536" text-anchor="middle" fill="#667085">Shaped payload and Set-Cookie</text>
  </g>
</svg>
